name: Java build and test

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        default: '8'
        type: string
      gradle_version:
        required: false
        default: '8.1.1'
        type: string
    secrets:
      gpr_actor:
        required: true
      gpr_token:
        required: true

jobs:

  build-n-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java_version }}
        distribution: 'corretto'

    - name: Check distribution directory
      run: mkdir ./distribution

    - name: Check keys directory
      run: mkdir ./distribution/keys

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ inputs.gradle_version }}
        cache-read-only: false

    - name: Build with Gradle
      run: ./gradlew -x test
      env:
        GITHUB_MDSC_USERNAME: ${{ secrets.gpr_actor }}
        GITHUB_MDSC_TOKEN: ${{ secrets.gpr_token }}

    - name: Test
      run: ./gradlew test
      env:
        GITHUB_MDSC_USERNAME: ${{ secrets.gpr_actor }}
        GITHUB_MDSC_TOKEN: ${{ secrets.gpr_token }}

    - name: Upload logs as artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: ./logs
