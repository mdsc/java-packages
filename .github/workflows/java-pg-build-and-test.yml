name: Java build and test

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        default: '8'
        type: string
      gradle_version:
        required: false
        default: '8.1.1'
        type: string
      postgres_image:
        required: false
        default: 'postgres:15'
        type: string
    secrets:
      gpr_actor:
        required: true
      gpr_token:
        required: true

jobs:

  build-n-test:
    runs-on: ubuntu-latest
    services:
      myPostgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: github!actions
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'corretto'

      - name: Setup Postgres using repo-specific script
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          PGPASSWORD: github!actions
        run: ./scripts/setup-postgres.sh

      - name: Check distribution directory
        run: mkdir ./distribution

      - name: Check keys directory
        run: mkdir ./distribution/keys

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew -x test
        env:
          GITHUB_MDSC_USERNAME: ${{ secrets.gpr_actor }}
          GITHUB_MDSC_TOKEN: ${{ secrets.gpr_token }}

      - name: Test
        run: ./gradlew testWithDB
        env:
          GITHUB_MDSC_USERNAME: ${{ secrets.gpr_actor }}
          GITHUB_MDSC_TOKEN: ${{ secrets.gpr_token }}

      - name: Upload logs as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: ./logs
